<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BikeHouston FAQ</title>
<style>
  :root {
    --bh-green: #2e7d32;
    --bh-dark: #1b1b1b;
    --bh-bg: #f6f7f5;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bh-bg);
    margin: 0;
    padding: 24px;
    color: var(--bh-dark);
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.sub { color: #555; margin-top: 0; margin-bottom: 20px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text] {
    flex: 1;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 1rem;
  }
  button {
    background: var(--bh-green);
    color: white;
    border: none;
    padding: 0 20px;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .popular {
    margin-bottom: 20px;
  }
  .popular-label {
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #666;
    margin-bottom: 8px;
  }
  .popular-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: white;
    border: 1px solid #d7e5d9;
    color: var(--bh-green);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 0.88rem;
    cursor: pointer;
    text-align: left;
  }
  .chip:hover { background: #eaf5ea; border-color: var(--bh-green); }
  #chat {
    background: white;
    border-radius: 12px;
    border: 1px solid #e0e0e0;
    padding: 16px;
    min-height: 320px;
    max-height: 55vh;
    overflow-y: auto;
    margin-bottom: 12px;
  }
  .msg { margin-bottom: 14px; line-height: 1.45; }
  .msg .role { font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: 2px; }
  .msg.user .role { color: #666; }
  .msg.bot .role { color: var(--bh-green); }
  .msg .bubble { padding: 10px 14px; border-radius: 10px; display: inline-block; max-width: 90%; }
  .msg.user .bubble { background: #eee; }
  .msg.bot .bubble { background: #eaf5ea; }
  .msg.bot .bubble.escalated { background: #fff4e5; border: 1px solid #f0c987; }
  .footnote { font-size: 0.95rem; color: #555; margin-top: 14px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ask BikeHouston</h1>
  <p class="sub">Questions about cycling laws, Houston bike infrastructure, or BikeHouston programs.</p>

  <form id="askForm">
    <input type="text" id="queryInput" placeholder="Ask a question…" autocomplete="off" required />
    <button type="submit" id="askBtn">Ask</button>
  </form>

  <div class="popular" id="popularWrap" style="display:none;">
    <div class="popular-label">Most asked questions</div>
    <div class="popular-chips" id="popularChips"></div>
  </div>

  <div id="chat"></div>

  <p class="footnote">Answers are AI-assisted and reviewed against BikeHouston's records. Questions we can't confidently answer are sent to our team.</p>
</div>

<script>
  const API_BASE = "https://web-production-b8927.up.railway.app";

  const chat = document.getElementById("chat");
  const form = document.getElementById("askForm");
  const input = document.getElementById("queryInput");
  const btn = document.getElementById("askBtn");
  const popularWrap = document.getElementById("popularWrap");
  const popularChips = document.getElementById("popularChips");

  const sessionId = Math.random().toString(36).slice(2);

  function addMessage(role, text, escalated = false) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.innerHTML = `
      <div class="role">${role === "user" ? "You" : "BikeHouston"}</div>
      <div class="bubble${escalated ? " escalated" : ""}">${text}</div>
    `;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function askQuestion(query) {
    addMessage("user", query);
    btn.disabled = true;
    try {
      const res = await fetch(`${API_BASE}/ask`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query, session_id: sessionId }),
      });
      const data = await res.json();
      addMessage("bot", data.answer, data.escalated);
    } catch (err) {
      addMessage("bot", "Something went wrong reaching the server — please try again in a moment.", true);
    } finally {
      btn.disabled = false;
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const query = input.value.trim();
    if (!query) return;
    input.value = "";
    askQuestion(query);
  });

  // Load the most-asked questions and render as clickable chips
  fetch(`${API_BASE}/popular`)
    .then((res) => res.json())
    .then((items) => {
      if (!Array.isArray(items) || items.length === 0) return;
      popularChips.innerHTML = "";
      items.forEach((item) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        chip.textContent = item.question;
        chip.addEventListener("click", () => askQuestion(item.question));
        popularChips.appendChild(chip);
      });
      popularWrap.style.display = "block";
    })
    .catch(() => {});
</script>
</body>
</html>
