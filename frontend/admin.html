<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BikeHouston FAQ — Admin</title>
<style>
  :root { --bh-green: #2e7d32; --bh-dark: #1b1b1b; --bh-bg: #f6f7f5; --bh-amber: #c97a24; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bh-bg); margin: 0; padding: 24px; color: var(--bh-dark); }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 2px; }
  .links { font-size: 0.85rem; margin-bottom: 14px; }
  .links a { color: var(--bh-green); text-decoration: none; margin-right: 14px; }
  .links a:hover { text-decoration: underline; }
  .warning { background: #fff4e5; border: 1px solid #f0c987; border-radius: 8px;
    padding: 10px 14px; font-size: 0.85rem; margin-bottom: 24px; color: #7a4e00; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .card { background: white; border: 1px solid #e0e0e0; border-radius: 10px; padding: 16px; }
  .card .num { font-size: 1.7rem; font-weight: 700; }
  .card .label { font-size: 0.8rem; color: #666; margin-top: 4px; }
  .card.amber .num { color: var(--bh-amber); }
  h2 { font-size: 1.1rem; margin-bottom: 10px; }
  .empty { color: #888; font-style: italic; font-size: 0.9rem; padding: 14px; }

  #gate { position: fixed; inset: 0; background: #f6f7f5; display: flex; align-items: center; justify-content: center; z-index: 50; }
  #gate .box { background: white; border: 1px solid #e0e0e0; border-radius: 12px; padding: 28px; width: 100%; max-width: 380px; }
  #gate h2 { margin: 0 0 6px 0; }
  #gate p { margin: 0 0 16px 0; color: #666; font-size: 0.88rem; line-height: 1.45; }
  #gate input { width: 100%; padding: 11px 13px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; margin-bottom: 10px; }
  #gate button { width: 100%; padding: 11px 0; background: var(--bh-green); color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
  #gate .err { color: #b3261e; font-size: 0.85rem; margin-top: 10px; display: none; }
  #main { display: none; }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .filters button { background: white; border: 1px solid #d7e5d9; color: #555;
    border-radius: 999px; padding: 6px 14px; font-size: 0.84rem; cursor: pointer; }
  .filters button:hover { border-color: var(--bh-green); color: var(--bh-green); }
  .filters button.active { background: var(--bh-green); border-color: var(--bh-green); color: white; font-weight: 600; }
  .filters .n { opacity: 0.75; font-size: 0.78rem; margin-left: 4px; }

  #searchBox { width: 100%; padding: 10px 13px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; margin-bottom: 12px; }

  .row { background: white; border: 1px solid #e0e0e0; border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
  .row-head { padding: 12px 14px; cursor: pointer; }
  .row-head:hover { background: #fafcfa; }
  .row-q { font-weight: 600; font-size: 0.95rem; line-height: 1.4; margin-bottom: 5px; }
  .row-meta { font-size: 0.76rem; color: #888; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill { border-radius: 999px; padding: 2px 9px; font-size: 0.71rem; font-weight: 600; }
  .pill.pub { background: #e6f0e7; color: var(--bh-green); }
  .pill.hold { background: #fdecea; color: #b3261e; }
  .pill.legal { background: #fff4e5; color: #8a5a00; }
  .pill.needs { background: #fff4e5; color: #a15c00; }
  .pill.notkb { background: #f0f0f0; color: #777; }
  .pill.stale { background: #eef2fb; color: #3a5a9a; }
  .pill.appr { background: #e8f0fb; color: #26558c; }

  .row-body { display: none; padding: 0 14px 14px 14px; border-top: 1px solid #f0f0f0; }
  .row.open .row-body { display: block; }
  .ans { background: #f7faf7; border-radius: 8px; padding: 12px; font-size: 0.89rem;
    line-height: 1.55; white-space: pre-wrap; margin: 12px 0; }
  .ans.none { color: #999; font-style: italic; }
  textarea { width: 100%; min-height: 150px; padding: 10px; border: 1px solid #ccc;
    border-radius: 8px; font-family: inherit; font-size: 0.89rem; line-height: 1.55; margin: 12px 0 8px 0; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .btn { background: white; border: 1px solid #ccc; color: #444; border-radius: 6px;
    padding: 6px 12px; font-size: 0.82rem; cursor: pointer; }
  .btn:hover { border-color: var(--bh-green); color: var(--bh-green); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn.primary { background: var(--bh-green); border-color: var(--bh-green); color: white; }
  .btn.danger:hover { border-color: #b3261e; color: #b3261e; }
  .who { padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.82rem; max-width: 210px; }
  .msg { font-size: 0.8rem; margin-top: 8px; }
  .msg.err { color: #b3261e; }
  .msg.ok { color: var(--bh-green); }
  .legal-warn { background: #fdecea; border: 1px solid #e0a2a2; border-radius: 8px;
    padding: 10px 12px; margin-top: 8px; font-size: 0.82rem; color: #7a2018; }
  .legal-warn ul { margin: 6px 0 0 0; padding-left: 18px; }
  .legal-warn code { background: #fff; padding: 1px 4px; border-radius: 3px; }
  .email-line { background: #fffaf2; border: 1px solid #f0c987; border-radius: 7px;
    padding: 8px 10px; margin: 10px 0; font-size: 0.83rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hist { margin-top: 10px; font-size: 0.79rem; color: #666; display: none; }
  .hist-row { padding: 6px 0; border-top: 1px solid #eee; }
  .hint { font-size: 0.78rem; color: #8a5a00; margin-top: 6px; }
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <h2>BikeHouston FAQ — Admin</h2>
    <p>Enter the shared admin password.</p>
    <input type="password" id="gatePw" placeholder="Admin password" autocomplete="current-password" />
    <button id="gateBtn">Unlock</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div class="wrap" id="main">
  <h1>FAQ Admin</h1>
  <div class="links">
    <a href="index.html">Ask page</a><a href="browse.html">Browse</a>
  </div>
  <div class="warning">Protected by a single shared password. Anyone with it has full read/write access to the knowledge base.</div>

  <div class="cards" id="cards"></div>

  <h2>Questions</h2>
  <input type="search" id="searchBox" placeholder="Search questions and answers…" />
  <div class="filters" id="filters"></div>
  <div id="list"><div class="empty">Loading…</div></div>
</div>

<script>
  const API_BASE = "https://web-production-b8927.up.railway.app";
  let ADMIN_PW = sessionStorage.getItem("bh_admin_pw") || "";
  let ROWS = [];
  let FILTER = "all";

  async function adminFetch(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers || {}, { "X-Admin-Password": ADMIN_PW });
    const res = await fetch(API_BASE + path, opts);
    if (res.status === 401) { sessionStorage.removeItem("bh_admin_pw"); location.reload(); throw new Error("unauthorized"); }
    return res;
  }

  const esc = (t) => String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  function fmtDate(iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    return isNaN(d) ? "—" : d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }

  function copyToClipboard(text, btn) {
    const done = () => { const w = btn.textContent; btn.textContent = "Copied"; setTimeout(() => { btn.textContent = w; }, 1400); };
    if (navigator.clipboard) { navigator.clipboard.writeText(text).then(done).catch(() => {}); }
  }

  // A row can match more than one filter — published and downvoted, for
  // instance. These narrow the list; they don't partition it.
  const FILTERS = [
    ["all",       "All",           () => true],
    ["needs",     "Needs review",  (r) => r.review_item_id != null],
    ["published", "Published",     (r) => r.entry && r.entry.status === "published"],
    ["held",      "Held",          (r) => r.entry && r.entry.status !== "published"],
    ["notkb",     "Not in KB",     (r) => !r.entry && !r.review_item_id],
    ["orphan",    "No question record", (r) => !!r.orphan],
    ["legal",     "Legal",         (r) => r.entry && r.entry.is_legal],
    ["down",      "Downvoted",     (r) => (r.unhelpful_count || 0) > 0 || (r.entry && (r.entry.unhelpful_count || 0) > 0)],
    ["stale",     "Stale",         (r) => r.stale],
  ];

  function visibleRows() {
    const f = FILTERS.find((x) => x[0] === FILTER)[2];
    const term = (document.getElementById("searchBox").value || "").trim().toLowerCase();
    return ROWS.filter((r) => {
      if (!f(r)) return false;
      if (!term) return true;
      return (r.question || "").toLowerCase().includes(term) || (r.answer || "").toLowerCase().includes(term);
    });
  }

  function renderFilters() {
    const el = document.getElementById("filters");
    el.innerHTML = FILTERS.map(([key, label, fn]) =>
      `<button data-f="${key}" class="${key === FILTER ? "active" : ""}">${label}<span class="n">${ROWS.filter(fn).length}</span></button>`
    ).join("");
    el.querySelectorAll("button").forEach((b) => {
      b.addEventListener("click", () => { FILTER = b.getAttribute("data-f"); renderFilters(); renderList(); });
    });
  }

  function statusPills(r) {
    const p = [];
    if (r.review_item_id != null) p.push('<span class="pill needs">needs review</span>');
    if (r.entry) {
      p.push(r.entry.status === "published"
        ? '<span class="pill pub">published</span>'
        : `<span class="pill hold">${esc(r.entry.status)}</span>`);
      if (r.entry.is_legal) p.push('<span class="pill legal">legal content</span>');
      if (r.entry.is_legal && r.entry.approved_by && r.entry.status !== "published")
        p.push('<span class="pill appr">approved, not published</span>');
    } else if (r.review_item_id == null) {
      p.push('<span class="pill notkb">not in KB</span>');
    }
    if (r.stale) p.push('<span class="pill stale">over a year old</span>');
    if (r.orphan) p.push('<span class="pill notkb">no question record</span>');
    return p.join(" ");
  }

  function renderList() {
    const list = document.getElementById("list");
    const rows = visibleRows();
    if (!rows.length) { list.innerHTML = '<div class="empty">Nothing here.</div>'; return; }
    list.innerHTML = "";
    rows.forEach((r) => list.appendChild(renderRow(r)));
  }

  function renderRow(r) {
    const div = document.createElement("div");
    div.className = "row";

    const up = (r.entry ? r.entry.helpful_count : 0) + (r.helpful_count || 0);
    const down = (r.entry ? r.entry.unhelpful_count : 0) + (r.unhelpful_count || 0);
    const votes = (up || down) ? ` · 👍 ${up} 👎 ${down}` : "";
    const dated = r.entry && r.entry.last_updated ? r.entry.last_updated : r.asked_at;

    div.innerHTML = `
      <div class="row-head">
        <div class="row-q">${esc(r.question)}</div>
        <div class="row-meta">${statusPills(r)}<span>${r.id != null ? "#" + r.id : "KB " + (r.entry ? r.entry.id : "?")} · ${fmtDate(dated)}${votes}</span></div>
      </div>
      <div class="row-body"></div>`;

    div.querySelector(".row-head").addEventListener("click", () => {
      const open = div.classList.toggle("open");
      if (open && !div.querySelector(".row-body").dataset.built) buildBody(div, r);
    });
    return div;
  }

  function buildBody(div, r) {
    const body = div.querySelector(".row-body");
    body.dataset.built = "1";
    const needsAnswer = r.review_item_id != null;
    const entry = r.entry;
    // Once a question has an entry, the entry's text is the live one — the
    // logged answer is a historical record of what the asker was shown.
    const currentText = (entry && entry.answer != null) ? entry.answer : (r.answer || "");

    const parts = [];

    if (needsAnswer) {
      // Escalated: show the AI's draft in an editable box rather than blank,
      // so whoever answers starts from something.
      const hasDraft = !!(r.review_draft && r.review_draft.trim());
      parts.push('<div class="hint">' + (hasDraft
        ? "This was escalated. The draft below is AI-generated and unverified — check every factual and legal claim before saving."
        : "This was escalated and has no draft yet. Write the answer below.") + "</div>");
      parts.push(`<textarea class="draft">${esc(hasDraft ? r.review_draft : "")}</textarea>`);
      if (r.asker_email) {
        parts.push(`<div class="email-line">Wants a reply at <code>${esc(r.asker_email)}</code>
          <button class="btn copy-email">Copy address</button><button class="btn copy-answer">Copy answer</button></div>`);
      }
      parts.push(`<div class="acts">
        <input class="who" type="text" placeholder="Your name" />
        <button class="btn primary" data-act="resolve">Save answer</button>
        <button class="btn" data-act="history">History</button>
        <button class="btn danger" data-act="delete">Delete</button></div>`);
    } else {
      parts.push(`<div class="ans${currentText ? "" : " none"}">${esc(currentText || "(no answer recorded)")}</div>`);
      parts.push('<textarea class="draft" style="display:none;"></textarea>');
      // Every row is editable, whatever state it's in — corrections tend to
      // arrive long after an answer was written.
      const acts = ['<button class="btn" data-act="edit">Edit</button>'];
      if (!entry && r.answer && r.id != null) acts.push('<button class="btn primary" data-act="promote">Promote to knowledge base</button>');
      if (entry) {
        if (entry.status === "published") {
          acts.push('<button class="btn" data-act="unpublish">Unpublish</button>');
        } else if (entry.is_legal && !entry.approved_by) {
          // Approving records the sign-off. Publishing is a separate decision.
          acts.push('<button class="btn primary" data-act="approve">Approve</button>');
        } else {
          acts.push('<button class="btn primary" data-act="publish">Publish</button>');
        }
      }
      acts.push('<button class="btn" data-act="history">History</button>');
      if (r.id != null) acts.push('<button class="btn danger" data-act="delete">Delete</button>');
      parts.push(`<div class="acts">${acts.join("")}</div>`);
      if (entry && entry.approved_by) parts.push(`<div class="hint">Approved by ${esc(entry.approved_by)}${entry.approved_at ? " on " + fmtDate(entry.approved_at) : ""} — not shown publicly.${entry.status !== "published" ? " Publish it when you're ready." : ""}</div>`);
    }

    parts.push('<div class="msg"></div><div class="hist"></div>');
    body.innerHTML = parts.join("");
    wire(body, r, div, currentText);
  }

  // currentText is passed in explicitly: it is computed in buildBody, and the
  // click handlers below live in this separate scope. Referencing it directly
  // threw a ReferenceError that killed the Edit handler silently — the button
  // highlighted on hover and did nothing at all.
  function wire(body, r, rowDiv, currentText) {
    const msg = body.querySelector(".msg");
    const draft = body.querySelector(".draft");
    const hist = body.querySelector(".hist");
    const say = (t, ok) => { msg.textContent = t; msg.className = "msg " + (ok ? "ok" : "err"); };

    const ce = body.querySelector(".copy-email");
    if (ce) ce.addEventListener("click", () => copyToClipboard(r.asker_email, ce));
    const ca = body.querySelector(".copy-answer");
    if (ca) ca.addEventListener("click", () => copyToClipboard(draft.value, ca));

    body.querySelectorAll("[data-act]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const act = btn.getAttribute("data-act");
        const entry = r.entry;

        if (act === "edit") {
          const view = body.querySelector(".ans");
          draft.value = currentText;
          draft.style.display = "block";
          if (view) view.style.display = "none";
          btn.textContent = "Save edit";
          btn.setAttribute("data-act", "saveedit");
          if (!body.querySelector(".who")) {
            const who = document.createElement("input");
            who.className = "who"; who.type = "text"; who.placeholder = "Your name";
            body.querySelector(".acts").prepend(who);
          }
          if (entry && entry.is_legal) say("Editing legal content clears its approval and unpublishes it until someone signs off again.", false);
          return;
        }

        const whoEl = body.querySelector(".who");
        const name = whoEl ? whoEl.value.trim() : "";

        if (act === "saveedit") {
          if (!name) return say("Your name is required — edits are recorded.");
          if (!draft.value.trim()) return say("Answer can't be empty.");
          btn.disabled = true;
          try {
            const q = new URLSearchParams({ editor_name: name, answer: draft.value });
            // With an entry, edit the entry. Without one, edit the logged
            // answer — which also keeps a promoted entry in step if there is one.
            if (!entry && r.id == null) { btn.disabled = false; return say("Nothing to save to."); }
            const path = entry ? `/admin/faq/${entry.id}?${q}` : `/admin/queries/${r.id}?${q}`;
            const res = await adminFetch(path, { method: "PATCH" });
            if (!res.ok) throw new Error();
            await reload();
          } catch (e) { btn.disabled = false; say("Could not save."); }
          return;
        }

        if (act === "resolve") {
          if (!name) return say("Your name is required.");
          if (!draft.value.trim()) return say("Write an answer first.");
          btn.disabled = true;
          try {
            const res = await adminFetch(`/admin/review-queue/${r.review_item_id}/resolve`, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ resolved_by: name, answer: draft.value }),
            });
            if (!res.ok) throw new Error();
            say("Saved. Promote it from this row if it should go on the site.", true);
            await reload();
          } catch (e) { btn.disabled = false; say("Could not save."); }
          return;
        }

        if (act === "promote") {
          btn.disabled = true;
          try {
            const res = await adminFetch(`/admin/promote/${r.id}`, { method: "POST" });
            if (res.status === 409) {
              const b = await res.json().catch(() => ({}));
              const d = b.detail || {};
              body.querySelector(".msg").innerHTML =
                '<div class="legal-warn"><strong>Not promoted — this answer makes a legal claim.</strong><div>' +
                esc(d.message || "") + "</div><ul>" +
                (d.findings || []).map((f) => `<li>${esc(f.kind)}: <code>${esc(f.match)}</code></li>`).join("") +
                "</ul></div>";
              btn.disabled = false;
              return;
            }
            if (!res.ok) throw new Error();
            await reload();
          } catch (e) { btn.disabled = false; say("Could not promote."); }
          return;
        }

        if (act === "approve") {
          const n = prompt("Your name — recorded with the approval, not shown publicly:");
          if (!n || !n.trim()) return;
          btn.disabled = true;
          try {
            await adminFetch(`/admin/faq/${entry.id}/approve?approver_name=${encodeURIComponent(n.trim())}`, { method: "POST" });
            await reload();
          } catch (e) { btn.disabled = false; say("Could not approve."); }
          return;
        }

        if (act === "publish" || act === "unpublish") {
          btn.disabled = true;
          try {
            const target = act === "publish" ? "published" : "needs_review";
            const res = await adminFetch(`/admin/faq/${entry.id}/status?status=${target}`, { method: "POST" });
            if (res.status === 409) { btn.disabled = false; return say("This is legal content and hasn't been approved — use Approve first, so a name is recorded."); }
            if (!res.ok) throw new Error();
            await reload();
          } catch (e) { btn.disabled = false; say("Could not change status."); }
          return;
        }

        if (act === "history") {
          if (!entry) return say("No edit history — this answer isn't in the knowledge base yet.");
          if (hist.style.display === "block") { hist.style.display = "none"; return; }
          hist.style.display = "block";
          hist.innerHTML = "Loading…";
          try {
            const rows = await (await adminFetch(`/admin/faq/${entry.id}/history`)).json();
            hist.innerHTML = rows.length
              ? rows.map((h) => `<div class="hist-row"><strong>${esc(h.editor_name)}</strong> — ${esc(h.action)} · ${fmtDate(h.created_at)}${h.note ? "<br>" + esc(h.note) : ""}</div>`).join("")
              : '<div class="hist-row">No recorded changes.</div>';
          } catch (e) { hist.innerHTML = "Could not load history."; }
          return;
        }

        if (act === "delete") {
          if (!confirm("Remove this question from the log? Any knowledge base entry it was promoted to stays published.")) return;
          btn.disabled = true;
          try {
            const res = await adminFetch(`/admin/queries/${r.id}`, { method: "DELETE" });
            if (!res.ok) throw new Error();
            rowDiv.remove();
            ROWS = ROWS.filter((x) => x.id !== r.id);
            renderFilters();
          } catch (e) { btn.disabled = false; say("Could not delete."); }
        }
      });
    });
  }

  async function loadStats() {
    try {
      const s = await (await adminFetch("/admin/stats")).json();
      document.getElementById("cards").innerHTML = `
        <div class="card"><div class="num">${s.total_questions}</div><div class="label">Questions asked</div></div>
        <div class="card amber"><div class="num">${s.open_review_count}</div><div class="label">Waiting on staff review</div></div>
        <div class="card"><div class="num" style="font-size:1.35rem;">${s.helpful_votes || 0} helpful &middot; ${s.unhelpful_votes || 0} not helpful</div>
          <div class="label">Reader feedback on answers</div></div>`;
    } catch (e) {}
  }

  async function reload() {
    ROWS = await (await adminFetch("/admin/questions?limit=500")).json();
    renderFilters();
    renderList();
    loadStats();
  }

  document.getElementById("searchBox").addEventListener("input", renderList);

  async function init() { await reload(); }

  const gate = document.getElementById("gate");
  const gatePw = document.getElementById("gatePw");
  const gateBtn = document.getElementById("gateBtn");
  const gateErr = document.getElementById("gateErr");

  async function tryUnlock(pw) {
    const res = await fetch(API_BASE + "/admin/verify", { headers: { "X-Admin-Password": pw } });
    if (res.ok) return { ok: true };
    let detail = "Incorrect password.";
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    return { ok: false, detail };
  }

  async function unlock() {
    const pw = gatePw.value.trim();
    if (!pw) return;
    gateBtn.disabled = true; gateBtn.textContent = "Checking…";
    const r = await tryUnlock(pw).catch(() => ({ ok: false, detail: "Could not reach the server." }));
    if (!r.ok) { gateErr.textContent = r.detail; gateErr.style.display = "block"; gateBtn.disabled = false; gateBtn.textContent = "Unlock"; return; }
    ADMIN_PW = pw;
    sessionStorage.setItem("bh_admin_pw", pw);
    gate.style.display = "none";
    document.getElementById("main").style.display = "block";
    init();
  }

  gateBtn.addEventListener("click", unlock);
  gatePw.addEventListener("keydown", (e) => { if (e.key === "Enter") unlock(); });

  (async function boot() {
    if (ADMIN_PW && (await tryUnlock(ADMIN_PW).catch(() => ({ ok: false }))).ok) {
      gate.style.display = "none";
      document.getElementById("main").style.display = "block";
      init();
    } else { sessionStorage.removeItem("bh_admin_pw"); gatePw.focus(); }
  })();
</script>
</body>
</html>
