<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BikeHouston FAQ</title>
<style>
  :root {
    --bh-green: #2e7d32;
    --bh-dark: #1b1b1b;
    --bh-bg: #f6f7f5;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bh-bg);
    margin: 0;
    padding: 24px;
    color: var(--bh-dark);
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.sub { color: #555; margin-top: 0; margin-bottom: 20px; }
  #chat {
    background: white;
    border-radius: 12px;
    border: 1px solid #e0e0e0;
    padding: 16px;
    min-height: 320px;
    max-height: 55vh;
    overflow-y: auto;
    margin-bottom: 12px;
  }
  .msg { margin-bottom: 14px; line-height: 1.45; }
  .msg .role { font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: 2px; }
  .msg.user .role { color: #666; }
  .msg.bot .role { color: var(--bh-green); }
  .msg .bubble { padding: 10px 14px; border-radius: 10px; display: inline-block; max-width: 90%; }
  .msg.user .bubble { background: #eee; }
  .msg.bot .bubble { background: #eaf5ea; }
  .msg.bot .bubble.escalated { background: #fff4e5; border: 1px solid #f0c987; }
  form { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 1rem;
  }
  button {
    background: var(--bh-green);
    color: white;
    border: none;
    padding: 0 20px;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .footnote { font-size: 0.75rem; color: #888; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ask BikeHouston</h1>
  <p class="sub">Questions about cycling laws, Houston bike infrastructure, or BikeHouston programs.</p>

  <div id="chat"></div>

  <form id="askForm">
    <input type="text" id="queryInput" placeholder="Ask a question…" autocomplete="off" required />
    <button type="submit" id="askBtn">Ask</button>
  </form>
  <p class="footnote">Answers are AI-assisted and reviewed against BikeHouston's records. Questions we can't confidently answer are sent to our team.</p>
</div>

<script>
  // Point this at your Railway backend URL once deployed
  const API_BASE = "https://YOUR-RAILWAY-APP.up.railway.app";

  const chat = document.getElementById("chat");
  const form = document.getElementById("askForm");
  const input = document.getElementById("queryInput");
  const btn = document.getElementById("askBtn");

  // simple per-tab session id so the backend can group a conversation if useful later
  const sessionId = Math.random().toString(36).slice(2);

  function addMessage(role, text, escalated = false) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.innerHTML = `
      <div class="role">${role === "user" ? "You" : "BikeHouston"}</div>
      <div class="bubble${escalated ? " escalated" : ""}">${text}</div>
    `;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const query = input.value.trim();
    if (!query) return;

    addMessage("user", query);
    input.value = "";
    btn.disabled = true;

    try {
      const res = await fetch(`${API_BASE}/ask`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query, session_id: sessionId }),
      });
      const data = await res.json();
      addMessage("bot", data.answer, data.escalated);
    } catch (err) {
      addMessage("bot", "Something went wrong reaching the server — please try again in a moment.", true);
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
