<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse Questions — BikeHouston FAQ</title>
<style>
:root {
--bh-green: #2e7d32;
--bh-dark: #1b1b1b;
--bh-bg: #f6f7f5;
}
* { box-sizing: border-box; }
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
background: var(--bh-bg);
margin: 0;
padding: 24px;
color: var(--bh-dark);
}
.wrap { max-width: 640px; margin: 0 auto; }
h1 { font-size: 1.4rem; margin-bottom: 4px; }
p.sub { color: #555; margin-top: 0; margin-bottom: 20px; }
.back { display: inline-block; margin-bottom: 16px; color: var(--bh-green); text-decoration: none; font-size: 0.9rem; }
.back:hover { text-decoration: underline; }
input[type=search] {
width: 100%;
padding: 12px 14px;
border-radius: 8px;
border: 1px solid #ccc;
font-size: 1rem;
margin-bottom: 20px;
}
.item {
background: white;
border: 1px solid #e0e0e0;
border-radius: 10px;
margin-bottom: 10px;
overflow: hidden;
}
.item-q {
padding: 14px 16px;
cursor: pointer;
display: flex;
justify-content: space-between;
align-items: center;
gap: 12px;
}
.item-q:hover { background: #fafafa; }
.item-q .qtext { font-weight: 600; }
.item-q .count { font-size: 0.75rem; color: #888; white-space: nowrap; }
.item-a {
display: none;
padding: 0 16px 16px;
line-height: 1.5;
color: #333;
border-top: 1px solid #eee;
padding-top: 12px;
}
.item.open .item-a { display: block; }
.feedback { margin-top: 12px; display: flex; gap: 8px; align-items: center; }
.feedback button {
background: white;
border: 1px solid #ccc;
border-radius: 6px;
padding: 5px 10px;
font-size: 0.85rem;
cursor: pointer;
}
.feedback button:hover { background: #f0f0f0; }
.feedback button.voted { background: var(--bh-green); color: white; border-color: var(--bh-green); }
.feedback .counts { font-size: 0.8rem; color: #888; }
.empty { color: #888; font-style: italic; padding: 20px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">← Back to Ask BikeHouston</a>
<h1>Browse previous questions</h1>
<p class="sub">Sorted by how often each has been asked. Search or scroll to find yours.</p>

<input type="search" id="searchBox" placeholder="Search questions…" />

<div id="list"><div class="empty">Loading…</div></div>
</div>

<script>
const API_BASE = "https://web-production-b8927.up.railway.app";
const list = document.getElementById("list");
const searchBox = document.getElementById("searchBox");
let allItems = [];

function render(items) {
if (!items.length) {
list.innerHTML = '<div class="empty">No questions match yet.</div>';
return;
}
list.innerHTML = items.map((item, i) => `
<div class="item" id="item-${i}">
<div class="item-q" data-idx="${i}">
<span class="qtext">${item.question}</span>
<span class="count">${item.ask_count} asked</span>
</div>
<div class="item-a">${item.answer}<div class="feedback">
<button class="up" data-id="${item.id}">👍 Helpful</button>
<button class="down" data-id="${item.id}">👎 Not helpful</button>
<span class="counts">${item.helpful_count} found this helpful</span>
</div>
</div>
</div>
`).join("");

document.querySelectorAll(".item-q").forEach((row) => {
row.addEventListener("click", () => {
row.closest(".item").classList.toggle("open");
});
});

document.querySelectorAll(".feedback button").forEach((btn) => {
btn.addEventListener("click", async (e) => {
e.stopPropagation();
const id = btn.getAttribute("data-id");
const helpful = btn.classList.contains("up");
btn.disabled = true;
const res = await fetch(`${API_BASE}/faq/${id}/feedback?helpful=${helpful}`, { method: "POST" });
const data = await res.json();
btn.classList.add("voted");
const countsEl = btn.closest(".feedback").querySelector(".counts");
if (countsEl) countsEl.textContent = `${data.helpful_count} found this helpful`;
});
});
}

searchBox.addEventListener("input", () => {
const term = searchBox.value.trim().toLowerCase();
if (!term) { render(allItems); return; }
render(allItems.filter((item) => item.question.toLowerCase().includes(term) || item.answer.toLowerCase().includes(term)));
});

fetch(`${API_BASE}/browse`)
.then((res) => res.json())
.then((items) => { allItems = items; render(items); })
.catch(() => { list.innerHTML = "<div class=\"empty\">Could not load questions right now.</div>"; });
</script>
</body>
</html>
